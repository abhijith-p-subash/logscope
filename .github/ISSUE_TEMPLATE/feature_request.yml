name: Feature request
description: Suggest something logscope should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        logscope has [hard constraints](https://github.com/abhijithpsubash/logscope/blob/main/docs/development.md#non-negotiable-constraints)
        — zero network egress, no persistence, a minimal runtime dependency
        surface, read-only on the watched folder, loopback-only binding. Ideas
        that need one of those relaxed are unlikely to land, so it's worth a
        look before writing this up.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting?
      description: The situation you're in, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like logscope to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
