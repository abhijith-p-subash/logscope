name: Bug report
description: Something in logscope doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Please don't paste real log content** — logscope
        exists because these exports carry client PII. Redact anything you share,
        or attach a minimal file with the values replaced.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. logscope watch ~/Downloads
        2. Drop an export with …
        3. The trace list shows …
    validations:
      required: true

  - type: dropdown
    id: command
    attributes:
      label: Which command?
      options:
        - logscope (default / watch)
        - logscope ui
        - logscope open
        - logscope scan
        - logscope report
        - the web UI itself
        - not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: logscope version
      description: Output of `logscope --version`
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version and OS
      description: Output of `node --version`, plus macOS / Windows / Linux
      placeholder: v22.19.0 on macOS 15
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Redacted sample input (optional)
      description: The smallest log snippet that triggers it, with PII removed.
      render: text
