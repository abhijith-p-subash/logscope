name: Release

# Publishes to npm when a GitHub Release is published.
#
# Auth: this workflow uses npm **trusted publishing** (OIDC) — no token is
# stored anywhere. Configure it once at
# npmjs.com → logscope → Settings → Trusted publisher → GitHub Actions
# (repository: abhijith-p-subash/logscope, workflow: release.yml).
#
# If you'd rather use a classic automation token instead, add an NPM_TOKEN
# secret and uncomment the `env:` block on the publish step.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for trusted publishing + provenance

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing and --provenance need a recent npm.
      - name: Use latest npm
        run: npm install -g npm@latest

      - run: npm ci

      - name: Verify the tag matches package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag ($TAG) does not match package.json ($PKG)." >&2
            exit 1
          fi
          echo "Publishing version $PKG"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # prepublishOnly rebuilds; --provenance attaches a signed, verifiable
      # link from the tarball back to this workflow run.
      - name: Publish
        run: npm publish --provenance --access public
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
