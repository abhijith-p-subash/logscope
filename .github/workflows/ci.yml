name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in `engines`; 24 is current.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check (engine + server)
        run: npm run typecheck

      - name: Type-check (web UI)
        run: npm run typecheck:web

      - name: Unit + integration tests
        run: npm test

      - name: Build
        run: npm run build

      # The compiled bundle is what users actually run — prove it works.
      - name: Smoke-test the built CLI
        run: |
          node dist/cli/index.js --version
          node dist/cli/index.js scan web/e2e/logs/sample.ndjson
          # CI mode must exit non-zero when the logs contain errors — the
          # fixture has one, so a zero exit here is a regression.
          if node dist/cli/index.js scan web/e2e/logs/sample.ndjson --json > /dev/null; then
            echo "scan --json exited 0 for logs containing errors" >&2
            exit 1
          fi

  e2e:
    name: e2e · chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The e2e web server runs TypeScript directly via
          # --experimental-strip-types, which needs Node 22.6+.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  package:
    name: package · install the tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Packs exactly what `npm publish` would, installs it into a clean
      # project, and runs the installed binary — catching a broken `files`
      # allowlist, a missing shebang, or a bad `bin` path before release.
      - name: Pack, install, and run
        run: |
          npm run build
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install /tmp/logscope-*.tgz
          ./node_modules/.bin/logscope --version
          ./node_modules/.bin/logscope --help
          test -f ./node_modules/logscope/dist/web/index.html
          test -f ./node_modules/logscope/LICENSE
