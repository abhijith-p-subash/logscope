<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="logscope">
  <title>logscope</title>
  <!--
    The mark is the ▚ glyph the app already uses in its header (U+259A,
    quadrant upper-left and lower-right): a 2x2 grid with one diagonal pair
    solid and the other pair hollow. Two interleaved streams, one of them
    reassembled — which is what logscope does to a CloudWatch export.
  -->
  <rect width="64" height="64" rx="14" fill="#14171C"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#2C333D" stroke-width="1.5"/>

  <!-- Reassembled: the solid diagonal. -->
  <rect x="12" y="12" width="18" height="18" rx="4" fill="#52C7D8"/>
  <rect x="34" y="34" width="18" height="18" rx="4" fill="#52C7D8"/>

  <!-- Fragmented: the hollow diagonal. -->
  <rect x="35" y="13" width="16" height="16" rx="3" fill="none" stroke="#3A424E" stroke-width="2"/>
  <rect x="13" y="35" width="16" height="16" rx="3" fill="none" stroke="#3A424E" stroke-width="2"/>
</svg>
