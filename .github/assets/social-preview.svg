<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <rect width="1280" height="640" fill="#14171C"/>

  <!-- Mark + wordmark -->
  <g transform="translate(340 130) scale(1.75)">
    <rect width="64" height="64" rx="14" fill="#1B1F26"/>
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#2C333D" stroke-width="1.5"/>
