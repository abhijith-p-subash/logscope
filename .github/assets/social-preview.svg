    <rect x="950"  y="84"  width="190" height="12" rx="3" fill="#52C7D8"/>
    <rect x="968"  y="110" width="140" height="12" rx="3" fill="#52C7D8" opacity="0.72"/>
    <rect x="990"  y="136" width="115" height="12" rx="3" fill="#9B8BF4"/>
    <rect x="1012" y="162" width="90"  height="12" rx="3" fill="#E2A33E"/>
    <rect x="1034" y="188" width="120" height="12" rx="3" fill="#E4676F"/>
    <rect x="1056" y="214" width="66"  height="12" rx="3" fill="#7BB661"/>
