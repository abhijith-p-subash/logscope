      <rect x="740" y="162" width="28" height="12" rx="3"/><rect x="776" y="162" width="40" height="12" rx="3"/><rect x="824" y="162" width="36" height="12" rx="3"/>
      <rect x="740" y="188" width="52" height="12" rx="3"/><rect x="800" y="188" width="24" height="12" rx="3"/><rect x="832" y="188" width="28" height="12" rx="3"/>
